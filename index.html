<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071013">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Sermon Translation / 讲道翻译</title>
<style>
  :root{color-scheme:dark;--bg:#071013;--surface:#0b181b;--surface-2:#112326;--ink:#f5efe2;
    --dim:#a9aea4;--line:#e0d2ae24;--accent:#9fb8d4;--accent-2:#d7bd82;--ok:#91b9a8;
    --bad:#d49a86;--shadow:#0008;--safe-bottom:max(1rem,env(safe-area-inset-bottom))}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
  body{min-height:100dvh;
       font:16px/1.6 system-ui,"PingFang SC","Noto Sans SC",sans-serif;
       background:radial-gradient(circle at 50% -8rem,#9fb8d414,transparent 28rem),var(--bg)}
  button{font:inherit}.shell{width:min(100% - 2rem,54rem);margin-inline:auto}
  header{position:fixed;z-index:10;inset:0 0 auto;border-bottom:1px solid var(--line);
         background:#071013e8;box-shadow:0 10px 30px #0003;backdrop-filter:blur(16px)}
  .topbar{min-height:4.35rem;display:flex;align-items:center;gap:.8rem}
  .mark{width:2rem;height:2rem;flex:0 0 auto;border-radius:.5rem;display:block;box-shadow:0 8px 24px var(--shadow)}
  .brand{min-width:0;line-height:1.2}.brand strong{display:block;font-size:.96rem;letter-spacing:-.01em}
  .brand span{display:block;margin-top:.2rem;color:var(--dim);font-size:.72rem}
  .connection{margin-left:auto;display:inline-flex;align-items:center;gap:.45rem;padding:.32rem .7rem;
    border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:.72rem;font-weight:750;
    letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}.connection i{width:.46rem;height:.46rem;border-radius:50%;background:currentColor}
  .connection[data-state="live"]{color:var(--ok)}
  .connection[data-state="live"] i{box-shadow:0 0 12px currentColor;animation:pulse 2s infinite}
  .connection[data-state="offline"]{color:var(--bad)}
  main{height:100dvh;padding:4.35rem 0 6.25rem}
  #log{height:100%;margin:0;padding:clamp(1.5rem,5vw,3rem) 0;list-style:none;overflow-y:auto;
       overscroll-behavior:contain;scrollbar-color:var(--line) transparent}
  #log li{animation:arrive .28s ease-out}#log li+li{margin-top:clamp(1.5rem,4vw,2.4rem)}
  .line-meta{display:flex;align-items:center;gap:.55rem;margin-bottom:.45rem;color:var(--dim);
             font-size:.68rem;font-weight:760;letter-spacing:.09em;text-transform:uppercase}
  .line-meta::before{content:"";width:1.2rem;height:1px;background:var(--accent)}
  .out{margin:0;max-width:48rem;font-size:clamp(1.6rem,4.8vw,2.65rem);font-weight:690;
       line-height:1.34;letter-spacing:-.025em;text-wrap:pretty}
  .src{margin:0;max-width:44rem;color:var(--dim);font-size:clamp(.95rem,2.7vw,1.12rem);line-height:1.55;text-wrap:pretty}
  /* between a heard line and the translation it is waiting for */
  .awaiting{display:flex;align-items:center;gap:.42rem;color:var(--dim);font-size:.68rem;
            font-weight:760;letter-spacing:.09em;text-transform:uppercase}
  .awaiting i{width:.4rem;height:.4rem;border-radius:50%;background:var(--accent);
              animation:waiting 1.3s ease-in-out infinite}
  .awaiting i:nth-of-type(2){animation-delay:.16s}.awaiting i:nth-of-type(3){animation-delay:.32s}
  .awaiting span{margin-left:.35rem}
  .empty{align-self:center;min-height:100%;display:grid;place-items:center;text-align:center;color:var(--dim)}
  .empty-inner{padding:2rem 1rem}.listening-mark{width:4rem;height:4rem;display:grid;place-items:center;
    margin:0 auto 1.25rem;border:1px solid var(--line);border-radius:50%;background:var(--surface);
    color:var(--accent);font-size:1.35rem;box-shadow:0 18px 50px #0004}
  .empty strong{display:block;color:var(--ink);font-size:clamp(1.2rem,4vw,1.55rem)}
  .empty p{margin:.5rem auto 0;max-width:28rem;font-size:.9rem}
  footer{position:fixed;z-index:10;inset:auto 0 0;border-top:1px solid var(--line);
         background:color-mix(in srgb,var(--surface) 96%,transparent);
         box-shadow:0 -18px 50px #0005;backdrop-filter:blur(18px)}
  .controls{display:flex;align-items:center;gap:1rem;padding:1rem 0 var(--safe-bottom)}
  #b{min-width:10.5rem;min-height:3.25rem;display:inline-flex;align-items:center;justify-content:center;
     gap:.55rem;padding:.75rem 1.35rem;border:1px solid var(--accent);border-radius:999px;background:var(--accent);
     color:#08151c;font-size:1rem;font-weight:780;cursor:pointer;box-shadow:0 10px 30px #0005;
     transition:transform .16s,filter .16s}#b:hover{filter:brightness(1.08)}#b:active{transform:translateY(1px)}
  #b:focus-visible{outline:3px solid #9fb8d438;outline-offset:3px}
  #b[data-mode="playing"] .play-icon::before{content:"Ⅱ";font-size:.82rem;letter-spacing:-.1em}
  #b[data-mode="loading"]{cursor:progress}#b[data-mode="loading"] .play-icon{width:1rem;height:1rem;
    border:2px solid #08151c55;border-top-color:#08151c;border-radius:50%;animation:spin .75s linear infinite}
  #b[data-mode="loading"] .play-icon::before{content:""}.play-icon::before{content:"▶";font-size:.9rem}
  .help{min-width:0}.help strong{display:block;font-size:.85rem}.headphones{margin-left:auto;color:var(--accent-2);
    font-size:.78rem;font-weight:720;white-space:nowrap}audio{display:none}
  @keyframes pulse{50%{opacity:.4}}@keyframes spin{to{transform:rotate(360deg)}}
  @keyframes arrive{from{opacity:0;transform:translateY(.5rem)}}
  @keyframes waiting{0%,65%,100%{opacity:.22}30%{opacity:.95}}
  @media (max-width:38rem){.shell{width:min(100% - 1.25rem,54rem)}.brand span{display:none}
    .brand strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
    main{padding-bottom:8.5rem}.connection{padding-inline:.55rem;font-size:.66rem;letter-spacing:.03em}#log{padding-block:1.25rem}
    .controls{display:grid;grid-template-columns:1fr auto;gap:.7rem .8rem}
    #b{grid-column:1/-1;width:100%}.headphones{align-self:start}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="shell topbar">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#071013"/><path d="M6 10a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-8l-5 5v-5h-1a2 2 0 0 1-2-2z" fill="#f1eadb"/><rect x="10" y="10" width="12" height="2.6" rx="1.3" fill="#071013"/><rect x="10" y="14.8" width="7.5" height="2.6" rx="1.3" fill="#8fa7c2"/></svg>
  <div class="brand"><strong>Sermon Translation · 讲道翻译</strong><span>Live interpretation · 现场翻译</span></div>
  <span class="connection" id="connection" data-state="connecting" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="connectionText">Connecting · 连接中</span></span>
</div></header>
<main class="shell"><ol id="log" role="log" aria-live="polite" aria-relevant="additions">
  <li class="empty"><div class="empty-inner"><span class="listening-mark" aria-hidden="true">◌</span>
    <strong>Waiting for the sermon · 等待讲道</strong><p>Live subtitles will appear here automatically.<br>现场字幕会自动显示在这里。</p>
  </div></li>
</ol></main>
<footer><div class="shell controls">
  <button id="b" type="button" data-mode="idle" aria-pressed="false"><span class="play-icon" aria-hidden="true"></span><span id="buttonText">Listen live · 收听直播</span></button>
  <div class="help"><strong id="playHint">Audio is off · 音频尚未开启</strong></div>
  <span class="headphones">🎧 Headphones · 请戴耳机</span>
</div></footer>
<audio id="a" preload="none"></audio>
<script>
  const $ = (id) => document.getElementById(id);
  const audio = $("a"), button = $("b"), log = $("log");
  let wantsAudio = false, retry = null;
  const pageClient = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
  let audioSession = "", audioGeneration = 0;
  const BASE_RESERVE_S = 1.25, MAX_RESERVE_S = 3, RESERVE_STEP_S = .5;
  const CHASE_MARGIN_S = .75, HARD_CHASE_MARGIN_S = 2, CRITICAL_BUFFER_S = .5;
  let reserveS = BASE_RESERVE_S, playbackStarted = false, lastBufferTrouble = -Infinity;
  const seenLines = new Set(), seenOrder = [];
  const playback = (mode, label, hint) => {
    button.dataset.mode = mode; button.setAttribute("aria-pressed", String(mode === "playing"));
    $("buttonText").textContent = label; $("playHint").textContent = hint;
  };
  const listen = () => {
    // Audio already waiting against the old stream can never be heard after src is replaced.
    // Keep its text, but do not leave it pinned to a timestamp from a dead connection.
    while (waiting.length) addLine(waiting.shift().line);
    playbackStarted = false; audio.playbackRate = 1; voiceClockOffset = null;
    audioSession = `${pageClient}-${++audioGeneration}`;
    wantsAudio = true; playback("loading", "Joining live audio · 正在连接", "Connecting to the live stream · 正在连接直播");
    audio.src = `/stream.mp3?client=${pageClient}&session=${audioSession}`; return audio.play();
  };
  button.onclick = () => {
    if (wantsAudio && !audio.paused) {
      wantsAudio = false; clearTimeout(retry); retry = null; audio.pause();
      audio.playbackRate = 1;
      playback("idle", "Resume live · 继续收听", "Audio paused · 音频已暂停"); return;
    }
    listen().catch(() => { wantsAudio = false;
      playback("error", "Try audio again · 重试音频", "Audio could not start · 音频无法播放"); });
  };
  const protectBuffer = () => {
    if (!wantsAudio) return;
    audio.playbackRate = 1;                 // never keep draining the reserve during trouble
    const now = Date.now();
    // waiting and stalled often describe the same outage. Count it once, then keep the
    // larger cushion for the rest of the service so the next short Wi-Fi gap is inaudible.
    if (playbackStarted && now - lastBufferTrouble > 5000) {
      reserveS = Math.min(MAX_RESERVE_S, reserveS + RESERVE_STEP_S);
      lastBufferTrouble = now;
    }
  };
  audio.addEventListener("playing", () => {
    playbackStarted = true;
    playback("playing", "Pause audio · 暂停语音", "Playing live audio · 正在播放直播语音");
  });
  audio.addEventListener("waiting", () => { if (wantsAudio) {
    protectBuffer();
    playback("loading", "Buffering · 正在缓冲", "Rebuilding a safe audio buffer · 正在补充语音缓冲");
  }});
  audio.addEventListener("stalled", protectBuffer);
  ["ended", "error"].forEach((name) => audio.addEventListener(name, () => {
    if (!wantsAudio || retry) return;
    protectBuffer();
    playback("loading", "Reconnecting · 正在重连", "The audio stream was interrupted · 语音连接已中断");
    retry = setTimeout(() => { retry = null; listen().catch(() => { wantsAudio = false;
      playback("error", "Try audio again · 重试音频", "Audio is unavailable · 暂时无法播放语音"); }); }, 1000);
  }));
  // The stream never stops -- silence goes out between sentences -- so whatever a phone
  // buffered while it was joining, it stays that far behind for the rest of the service, and
  // every rebuffer adds more. Nothing drains it on its own, so measure the audio held ahead
  // of the playhead and catch up gently -- but retain enough as a jitter buffer for uneven
  // Wi-Fi. The old 0.4 s floor made a short network gap audible in the middle of a sentence.
  // A real underrun raises the floor automatically, up to three seconds.
  // How far the playhead is behind the newest audio this phone holds. A reconnect leaves the
  // old buffered range behind and starts a new one, so the range being played is the one to
  // measure against -- the last range can be an abandoned one, and a gap of minutes read off
  // it would mistime every subtitle for the rest of the service.
  const bufferedRange = () => {
    const held = audio.buffered;
    if (!held || !held.length) return null;
    for (let i = 0; i < held.length; i++)
      if (audio.currentTime >= held.start(i) && audio.currentTime <= held.end(i))
        return { start: held.start(i), end: held.end(i) };
    // The player is stalled between ranges. The final one may be an abandoned range from
    // before a reconnect; treating it as live would create minutes of phantom lag.
    return null;
  };
  const bufferedEdge = () => bufferedRange()?.end ?? null;
  const bufferedAhead = () => {
    const edge = bufferedEdge();
    return audio.paused || edge === null ? null : Math.max(0, edge - audio.currentTime);
  };
  const chaseLiveEdge = () => {
    const ahead = bufferedAhead();
    if (ahead === null) return (audio.playbackRate = 1);
    // When the reserve is almost gone, 3% slower speech buys time for the next network
    // burst without an abrupt stop. Pitch preservation is the media element's default.
    if (ahead < CRITICAL_BUFFER_S) audio.playbackRate = .97;
    else if (ahead <= reserveS + .25) audio.playbackRate = 1;
    else if (ahead > reserveS + HARD_CHASE_MARGIN_S) audio.playbackRate = 1.1;
    else if (ahead > reserveS + CHASE_MARGIN_S) audio.playbackRate = 1.06;
  };
  setInterval(chaseLiveEdge, 1000);
  const connection = (state, text) => { $("connection").dataset.state = state; $("connectionText").textContent = text; };
  // A sentence takes seconds to say, so putting all of it on screen when its first word is
  // spoken leaves the rest sitting there ahead of the voice -- which is what reads as the
  // voice lagging the text. Reveal it as it is spoken instead. Chinese is counted by the
  // character and English by the word, which is as close to speaking time as a clock can get
  // without the voice telling us where it is.
  //
  // Measured against the voice's own clock rather than the wall's, because the two do not
  // agree: this page plays 6% fast whenever it is catching up to the live edge, and stops
  // altogether while a phone rebuffers. Both move currentTime and neither moves Date.now().
  const PIECE = /[\u3400-\u9fff]|[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*|[^\s]/g;
  const MAX_REVEAL_S = 30, REVEAL_STEP_MS = 50;
  const wordWeight = (piece) => {
    if (/^[\u3400-\u9fff]$/.test(piece)) return 1;
    if (/^\d+$/.test(piece)) return piece.length;
    if (!/^[A-Za-z]/.test(piece)) return 0;       // punctuation is not a spoken word
    // Syllables follow spoken time better than character count: "church" should not take
    // six times as long as "a". The small length term keeps dense one-syllable words honest.
    const bare = piece.toLowerCase().replace(/(?:[^aeiou]e|es|ed)$/, "");
    const syllables = (bare.match(/[aeiouy]+/g) || []).length;
    return Math.max(1, syllables) + Math.max(0, piece.length - 6) * .08;
  };
  const pauseWeight = (piece) => /[.!?。！？]/.test(piece) ? .8
    : /[,，;；:：]/.test(piece) ? .45 : /[—–-]/.test(piece) ? .35 : 0;
  const revealOver = (body, text, secs, startedAt) => {
    const pieces = [...text.matchAll(PIECE)];
    if (!pieces.length) return (body.textContent = text);
    const marks = [];                       // [when this spoken piece starts, its text end]
    let said = 0;
    for (const piece of pieces) {
      const word = wordWeight(piece[0]);
      const pause = pauseWeight(piece[0]);
      if (!word) {
        // Punctuation is seen with the word before it, then its pause belongs before the
        // next word. Revealing it as a word of its own makes the text race through commas.
        if (marks.length) marks[marks.length - 1][1] = piece.index + piece[0].length;
        said += pause;
      } else {
        marks.push([said, piece.index + piece[0].length]);
        said += word;
      }
    }
    if (!marks.length || !said) return (body.textContent = text);
    for (const mark of marks) mark[0] /= said;
    let next = 0;
    const step = () => {
      // Paused means nobody is listening to this line any more; show the rest of it.
      const spoken = audio.paused ? 1 : (audio.currentTime - startedAt) / secs;
      while (next < marks.length && marks[next][0] <= spoken) {
        body.textContent = text.slice(0, marks[next][1]);
        next += 1;
      }
      log.scrollTop = log.scrollHeight;
      if (next >= marks.length) clearInterval(reveal);
    };
    const reveal = setInterval(step, REVEAL_STEP_MS);
    step();
  };
  // Whisper re-transcribes a turn as the speaker keeps going, so a heard line arrives again
  // and again with more of the sentence in it. The bridge gives every turn an id; a line
  // whose id is already on screen revises what is there rather than repeating it.
  const onScreen = new Map();
  // The translation of a line is held back until the voice reaches it, which on a phone with
  // a full buffer is a few seconds of a screen that looks like it has stopped working. Three
  // dots under the heard line, for exactly as long as there is a translation still to come.
  const waitingLine = document.createElement("li");
  waitingLine.className = "awaiting";
  waitingLine.setAttribute("aria-hidden", "true");     // the log announces itself; dots do not
  for (let dot = 0; dot < 3; dot++) waitingLine.appendChild(document.createElement("i"));
  const waitingLabel = document.createElement("span");
  waitingLabel.textContent = "Translating · 正在翻译";
  waitingLine.appendChild(waitingLabel);
  // Shown while the newest line on screen is one that was heard, which is the whole of the
  // question the dots answer. Counting what is outstanding instead would leave them spinning
  // for the rest of the service after one utterance the translator answered with nothing --
  // which is what it is told to do when the preacher is already speaking the listeners'
  // language.
  let awaiting = false;
  const showWaiting = () => {
    if (awaiting) log.appendChild(waitingLine);        // appendChild moves it to the end
    else waitingLine.remove();
    log.scrollTop = log.scrollHeight;
  };
  const addLine = ({ kind, text, at, secs, id, reply_to }, voiceAt = null) => {
    const showing = onScreen.get(id);
    if (showing) { showing.textContent = text; log.scrollTop = log.scrollHeight; return; }
    log.querySelector(".empty")?.remove();
    const safeKind = kind === "src" ? "src" : "out";
    const item = document.createElement("li"), meta = document.createElement("div"), body = document.createElement("p");
    item.dataset.kind = safeKind; item.lineId = id;
    meta.className = "line-meta"; meta.textContent = `${at || "Live"} · ${safeKind === "src" ? "Heard / 原文" : "Translation / 翻译"}`;
    body.className = safeKind;
    const spoken = !audio.paused && Number.isFinite(voiceAt) && secs > 0 && secs < MAX_REVEAL_S;
    if (spoken) revealOver(body, text, secs, voiceAt); else body.textContent = text;
    item.append(meta, body);
    // Under the sentence it translates, not at the bottom. A translation is held back until
    // the voice reaches it, and by then the preacher is a line or two further on, so
    // appending it would file it under somebody else's words. The bridge says which heard
    // line it answers; a line already scrolled off the end has nothing to sit under.
    let after = reply_to === undefined ? null : onScreen.get(reply_to)?.parentNode;
    // A turn is often several sentences, each spoken and published on its own, so that heard
    // line may already have translations under it. They stack in the order they were said.
    while (after?.nextSibling?.dataset.kind === "out") after = after.nextSibling;
    if (after) log.insertBefore(item, after.nextSibling); else log.appendChild(item);
    if (id !== undefined) onScreen.set(id, body);
    waitingLine.remove();             // the cap counts lines of sermon, not the dots
    while (log.children.length > 40) { onScreen.delete(log.firstChild.lineId); log.firstChild.remove(); }
    // The dots go under the newest line whenever that line is one that was heard: its
    // translation is the one still to come. Since a translation files itself under its own
    // sentence, above anything heard since, the last line on screen answers that by itself.
    const newest = log.children[log.children.length - 1];
    awaiting = !!newest && newest.dataset.kind === "src";
    showWaiting();                    // ... which go back under the newest line
    log.scrollTop = log.scrollHeight; // every new line returns listeners to the live edge
  };
  // The bridge publishes a line as its own audio starts down the wire, but this phone plays
  // that audio later -- after whatever it buffered on the way in, and after whatever is
  // already queued ahead of it. When the MP3 connection receives its first byte, the bridge
  // sends that byte's continuous stream position over the subtitle connection. That maps
  // every translated line to this phone's timeline without using packet arrival time. Show
  // it when the playhead gets there. That is a position, not a delay, so it survives a
  // rebuffer, the 6% catch-up, and the seconds before playback has started at all -- where a
  // delay measured against a stopped playhead is zero and puts the first line on screen
  // before audio exists.
  //
  // Only the translation waits: what was heard is not read out by anything, and it is the
  // first sign on screen that the room is being heard.
  const MAX_HOLD_S = 15, RELEASE_STEP_MS = 50;
  const waiting = [];              // [{ at: audio position, or null until a buffer exists }]
  // The bridge supplies a continuous audio clock. This phone's media clock starts at zero
  // whenever it joins; the audio-sync event supplies that exact origin. MP3 and SSE use
  // separate sockets, so inferring the origin from their arrival times is not reliable.
  let voiceClockOffset = null;
  const anchorWaiting = (now = Date.now()) => {
    const range = bufferedRange();
    for (const held of waiting) if (held.at === null) {
      if (voiceClockOffset !== null && Number.isFinite(held.line.voice_at))
        held.at = voiceClockOffset + held.line.voice_at;
      else if (range !== null && !Number.isFinite(held.line.voice_at))
        // Backward compatibility with a bridge from before audio-clock positions existed.
        held.at = Math.max(range.start, range.end - Math.max(0, now - held.since) / 1000);
    }
  };
  const showWithVoice = (line) => {
    const edge = bufferedEdge();
    if (line.kind !== "out" || (audio.paused && !wantsAudio))
      return addLine(line);               // nobody is listening; nothing to wait for
    const now = Date.now();
    anchorWaiting(now);
    const at = voiceClockOffset !== null && Number.isFinite(line.voice_at)
      ? voiceClockOffset + line.voice_at : Number.isFinite(line.voice_at) ? null : edge;
    waiting.push({ at, line, since: now });
  };
  const releaseSpoken = () => {
    anchorWaiting();
    // In order, always: the positions only ever grow, so the queue stays the order spoken.
    // The deadline is for a phone that stopped playing without saying so -- a line that
    // waits longer than any buffer could explain is better late than never.
    while (waiting.length && (waiting[0].at !== null && audio.currentTime >= waiting[0].at
                              || (audio.paused && !wantsAudio)
                              || Date.now() - waiting[0].since > MAX_HOLD_S * 1000))
      { const held = waiting.shift(); addLine(held.line, held.at); }
  };
  setInterval(releaseSpoken, RELEASE_STEP_MS);
  const es = new EventSource(`/subs?client=${pageClient}`);
  es.addEventListener("audio-sync", (event) => { try {
    const sync = JSON.parse(event.data);
    if (sync.client !== pageClient || sync.session !== audioSession
        || !Number.isFinite(sync.origin)) return;
    // currentTime zero is the first MP3 byte this connection received. Both the origin and
    // each line's voice_at are positions on the server's continuous audio timeline, so this
    // is an exact mapping rather than an inference from unrelated packet arrival times.
    voiceClockOffset = -sync.origin;
    anchorWaiting();
  } catch (error) { console.error("Bad audio sync event", error); } });
  es.onopen = () => connection("live", "Live · 已连接");
  es.onerror = () => connection("offline", "Reconnecting · 重新连接中");
  es.onmessage = (event) => { try {
      const line = JSON.parse(event.data);
      const signature = JSON.stringify([line.kind, line.text, line.at, line.id]);
      if (seenLines.has(signature)) return; // reconnects replay the server's recent backlog
      seenLines.add(signature); seenOrder.push(signature);
      if (seenOrder.length > 80) seenLines.delete(seenOrder.shift());
      showWithVoice(line);
    } catch (error) { console.error("Bad subtitle event", error); } };
</script>
</body>
</html>
