<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sermon Translation / 讲道翻译</title>
<style>
  body{font:16px/1.6 system-ui;margin:0;height:100dvh;background:#111;color:#eee;
       display:grid;grid-template-rows:auto 1fr auto;gap:.5rem}
  header,footer{padding:.8rem;text-align:center}
  header{border-bottom:1px solid #333;font-weight:600}
  #log{overflow-y:auto;padding:0 1.2rem;display:flex;flex-direction:column;justify-content:flex-end}
  #log p{margin:.2rem 0 1rem}
  .out{font-size:1.4rem}
  .src{font-size:.9rem;opacity:.45;margin-top:-.9rem}
  button{font-size:1.3rem;padding:1rem 2.2rem;border-radius:999px;border:0;
         background:#2d6cdf;color:#fff}
  small{display:block;opacity:.5;margin-top:.6rem}
</style>
<header>Sermon Translation · 讲道翻译</header>
<div id="log"></div>
<footer>
  <button id="b">▶ Listen / 收听</button>
  <small>Subtitles run a few seconds behind the speaker, audio a little behind those.<br>
         字幕比讲员慢几秒，语音再慢一点。Headphones please / 请戴耳机。</small>
</footer>
<audio id="a"></audio>
<script>
  b.onclick = () => {
    a.src = "/stream.mp3?" + Date.now();   // always join live, never a stale buffer
    a.play().then(() => b.textContent = "🔊 Playing / 收听中")
            .catch(e => b.textContent = e.message);
  };

  const es = new EventSource("/subs");
  es.onopen = () => log.innerHTML = "";    // reconnect replays the backlog, so start clean
  es.onmessage = e => {
    const {kind, text} = JSON.parse(e.data);
    log.insertAdjacentHTML("beforeend",
      `<p class="${kind}">${text.replace(/[<&]/g, c => c == "<" ? "&lt;" : "&amp;")}</p>`);
    while (log.children.length > 40) log.firstChild.remove();
    log.scrollTop = log.scrollHeight;
  };
</script>
