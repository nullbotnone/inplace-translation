<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Sermon Translation / 讲道翻译</title>
<style>
  body{font:16px/1.6 system-ui;margin:0;height:100dvh;background:#111;color:#eee;
       display:grid;grid-template-rows:auto 1fr auto;gap:.5rem}
  header,footer{padding:.8rem;text-align:center}
  header{border-bottom:1px solid #333;font-weight:600;
         display:flex;align-items:center;justify-content:center;gap:.6rem}
  .mark{width:1.6rem;height:1.6rem;flex:0 0 auto;border-radius:.4rem;display:block}
  #log{overflow-y:auto;padding:0 1.2rem;display:flex;flex-direction:column;justify-content:flex-end}
  #log p{margin:.2rem 0 1rem}
  .out{font-size:1.4rem}
  .src{font-size:.9rem;opacity:.45;margin-top:-.9rem}
  button{font-size:1.3rem;padding:1rem 2.2rem;border-radius:999px;border:0;
         background:#2d6cdf;color:#fff}
  small{display:block;opacity:.5;margin-top:.6rem}
</style>
<header><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#071013"/><path d="M6 10a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-8l-5 5v-5h-1a2 2 0 0 1-2-2z" fill="#f1eadb"/><rect x="10" y="10" width="12" height="2.6" rx="1.3" fill="#071013"/><rect x="10" y="14.8" width="7.5" height="2.6" rx="1.3" fill="#8fa7c2"/></svg><span>Sermon Translation · 讲道翻译</span></header>
<div id="log"></div>
<footer>
  <button id="b">▶ Listen / 收听</button>
  <small>Subtitles run a few seconds behind the speaker, audio a little behind those.<br>
         字幕比讲员慢几秒，语音再慢一点。Headphones please / 请戴耳机。</small>
</footer>
<audio id="a"></audio>
<script>
  const listen = () => {
    a.src = "/stream.mp3?" + Date.now();   // always join live, never a stale buffer
    return a.play();
  };
  b.onclick = () => listen().then(() => b.textContent = "🔊 Playing / 收听中")
                            .catch(e => b.textContent = e.message);

  // The stream ends on any wifi hiccup, and the server drops a listener whose phone falls
  // behind. Nothing in <audio> retries, so without this the phone goes quiet for the rest
  // of the sermon while the subtitles keep scrolling.
  let retry = null;
  ["ended", "error"].forEach((e) => a.addEventListener(e, () => {
    if (!a.src || retry) return;
    b.textContent = "… reconnecting / 重新连接";
    retry = setTimeout(() => {
      retry = null;
      listen().then(() => b.textContent = "🔊 Playing / 收听中").catch(() => {});
    }, 1000);
  }));

  const es = new EventSource("/subs");
  es.onopen = () => log.innerHTML = "";    // reconnect replays the backlog, so start clean
  es.onmessage = e => {
    const {kind, text} = JSON.parse(e.data);
    log.insertAdjacentHTML("beforeend",
      `<p class="${kind}">${text.replace(/[<&]/g, c => c == "<" ? "&lt;" : "&amp;")}</p>`);
    while (log.children.length > 40) log.firstChild.remove();
    log.scrollTop = log.scrollHeight;
  };
</script>
