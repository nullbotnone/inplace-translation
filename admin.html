<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Sermon Translation · Console</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#071013;--surface:#0b181b;--surface-2:#112121;--ink:#f1eadb;--dim:#a9a899;
    --line:#dccca429;--line-strong:#d2bb8454;--accent:#8fa7c2;--on-accent:#08151c;
    --accent-soft:#8fa7c21c;--ok:#91a89f;--warn:#e2c57b;--bad:#c98f7b;
    --glow:#8fa7c210;--shadow:#00000030;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f1eadb;--surface:#faf5e9;--surface-2:#e8dfcc;--ink:#102022;--dim:#5f6964;
    --line:#8b754936;--line-strong:#9b7d3f80;--accent:#3f5d7d;--on-accent:#f6f1e6;
    --accent-soft:#3f5d7d12;--ok:#4a6b5d;--warn:#8a6a1f;--bad:#a05a42;
    --glow:#3f5d7d12;--shadow:#4b391510;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
       radial-gradient(circle at 50% -10rem,var(--glow),transparent 34rem),var(--bg);color:var(--ink);
       font:15px/1.6 system-ui,"PingFang SC","Noto Sans SC",sans-serif}
  .wrap{max-width:74rem;margin:0 auto;padding:clamp(1rem,3vw,2rem)}
  h1{margin:0;font-size:clamp(1.15rem,2vw,1.35rem);font-weight:720;letter-spacing:-.025em}
  h2{margin:0 0 1rem;font:750 .72rem/1.4 var(--mono);letter-spacing:.12em;
     text-transform:uppercase;color:var(--dim)}
  header{display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;padding:.2rem 0 1.15rem}
  .brand{display:flex;flex-direction:column;line-height:1.25}
  .brand p{margin:.15rem 0 0;color:var(--dim);font-size:.78rem}
  .actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .commandbar{position:sticky;top:0;z-index:10;margin-inline:clamp(-2rem,-3vw,-1rem);
              padding:.75rem clamp(1rem,3vw,2rem);border-block:1px solid var(--line);
              background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
  .actions-inline{margin-top:.7rem;gap:.5rem}
  .grow{flex:1}
  .mark{width:1.9rem;height:1.9rem;flex:0 0 auto;border-radius:.45rem;display:block}

  .state{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .8rem;border-radius:999px;
         border:1px solid var(--line);font:750 .72rem/1.4 var(--mono);letter-spacing:.1em;
         text-transform:uppercase}
  .state i{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;
           box-shadow:0 0 10px currentColor}
  .state[data-s=running]{color:var(--ok)} .state[data-s=running] i{animation:pulse 2s infinite}
  .state[data-s=starting]{color:var(--warn)} .state[data-s=starting] i{animation:pulse .8s infinite}
  .state[data-s=stopped]{color:var(--dim)}
  .state[data-s=error]{color:var(--bad)}
  @keyframes pulse{50%{opacity:.3}}

  button{font:inherit;font-size:.88rem;font-weight:650;padding:.55rem 1.1rem;border-radius:8px;
         border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;
         transition:border-color .16s,color .16s,background .16s,transform .16s,filter .16s}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button.primary:hover:not(:disabled){filter:brightness(1.1);color:var(--on-accent)}
  button.attention{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 12%,transparent)}
  button.compact{padding:.35rem .65rem;font-size:.76rem}
  button[aria-busy="true"]{cursor:progress}

  /* Language and theme controls, same shape as the rest of slashai.app. */
  .seg{display:inline-flex;padding:.2rem;border:1px solid var(--line);border-radius:999px;
       background:var(--surface)}
  .seg button{min-width:2.2rem;border:0;border-radius:999px;background:transparent;
              color:var(--dim);padding:.27rem .52rem;font-size:.8125rem}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
  .iconbtn{width:2.3rem;height:2.3rem;padding:0;display:grid;place-items:center;border-radius:50%;
           border:1px solid var(--line);background:var(--surface)}
  .theme-icon{width:.95rem;height:.95rem;border:1.5px solid currentColor;border-radius:50%;
              box-shadow:inset -.3rem -.3rem 0 currentColor;transform:rotate(-25deg);
              transition:transform .25s ease}
  .iconbtn:hover .theme-icon{transform:rotate(20deg)}
  .iconbtn[data-mode=light] .theme-icon{background:currentColor;box-shadow:none}
  .iconbtn[data-mode=dark] .theme-icon{background:transparent;
                                       box-shadow:inset -.32rem -.2rem 0 currentColor}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

  .cards{display:grid;gap:1rem;grid-template-columns:repeat(12,minmax(0,1fr));margin-top:1.25rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
        padding:1.25rem;display:flex;flex-direction:column;grid-column:span 6;
        box-shadow:0 12px 35px var(--shadow)}
  .card.quality{grid-column:span 8}
  .card.listeners-card{grid-column:span 4}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
  .card-head h2{margin-bottom:1rem}
  @media (max-width:62rem){.card,.card.quality,.card.listeners-card{grid-column:1/-1}}
  label{display:block;margin-bottom:1rem}
  .card > label:last-of-type{margin-bottom:.6rem}
  .card .hint:last-child{margin-top:auto;padding-top:.6rem}
  label span{display:block;margin-bottom:.3rem;font-size:.82rem;color:var(--dim)}
  select,input[type=number],textarea{width:100%;font:inherit;font-size:.88rem;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.58rem .7rem;
    outline:0;transition:border-color .16s,box-shadow .16s}
  select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,.url:focus-visible{
    border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:0}
  textarea{min-height:9rem;flex:1;font:.82rem/1.7 var(--mono);resize:vertical}
  .row{display:flex;gap:.8rem;align-items:flex-end}
  .row label{flex:1}
  .hint{margin:0;font-size:.8rem;color:var(--dim)}
  .hint.warn{color:var(--warn)}

  .meter{height:.5rem;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:.5rem 0 .4rem}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s linear}
  .meter i.hot{background:var(--bad)}
  .meter i.quiet{background:var(--dim)}

  .stat{display:flex;justify-content:space-between;align-items:center;
        margin-top:auto;padding-top:.8rem;font-size:.88rem}
  .stat span{color:var(--dim);font-family:var(--mono);font-size:.82rem}

  #qr{display:grid;place-items:center;padding:.8rem;background:#fff;border-radius:10px}
  #qr svg{display:block;width:100%;height:auto;max-width:11rem}
  .url{display:block;margin:.7rem 0 0;text-align:center;font:.82rem/1.5 var(--mono);
       overflow-wrap:anywhere;color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
  .share-actions{justify-content:center;margin-top:.7rem}
  .count{font:650 .72rem/1.4 var(--mono);color:var(--dim);white-space:nowrap}
  .count.warn{color:var(--warn)}

  /* max-height is what makes it scroll: flex:1 with no upper bound just grows to fit
     the content, so overflow-y never engages and the card gets taller all service. */
  #log{margin:0;padding:0;list-style:none;flex:1;min-height:8rem;max-height:17rem;
       overflow-y:auto;overscroll-behavior:contain}
  #log li{padding:.5rem 0;border-bottom:1px solid var(--line)}
  #log li:last-child{border-bottom:0}
  #log .t{color:var(--dim);font:.7rem/1 var(--mono);letter-spacing:.08em}
  #log .src{color:var(--dim);font-size:.85rem}
  #log .out{font-size:1rem}
  .empty{color:var(--dim);font-size:.85rem}

  .toast{position:fixed;z-index:20;left:50%;bottom:1.5rem;transform:translate(-50%,2rem);opacity:0;
         background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;
         max-width:calc(100vw - 2rem);padding:.6rem 1.1rem;font-size:.82rem;font-weight:650;
         text-align:center;box-shadow:0 12px 35px var(--shadow);transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:40rem){
    .wrap{padding:1rem}.commandbar{margin-inline:-1rem;padding-inline:1rem}
    .commandbar .grow{display:none}.commandbar #detail{flex-basis:100%;margin:0}
    .row{display:grid;grid-template-columns:1fr}.brand p{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#071013"/><path d="M6 10a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-8l-5 5v-5h-1a2 2 0 0 1-2-2z" fill="#f1eadb"/><rect x="10" y="10" width="12" height="2.6" rx="1.3" fill="#071013"/><rect x="10" y="14.8" width="7.5" height="2.6" rx="1.3" fill="#8fa7c2"/></svg>
  <div class="brand">
    <h1 data-zh="讲道翻译控制台" data-tw="講道翻譯控制台" data-en="Sermon Translation"></h1>
    <p data-zh="现场翻译运行与监听" data-tw="現場翻譯執行與監聽"
       data-en="Live translation control and monitoring"></p>
  </div>
  <span class="state" id="state" data-s="stopped" role="status" aria-live="polite">
    <i aria-hidden="true"></i><span id="statetext"></span>
  </span>
  <span class="grow"></span>
  <!-- No data-* translation on this element: labels() writes textContent, which would
       replace these buttons with the label text. The sermon's languages are named in
       their own card, so a static aria-label is enough to tell the two apart. -->
  <div class="seg" role="group" id="langseg" aria-label="Console language">
    <button type="button" data-lang="zh">简</button>
    <button type="button" data-lang="tw">繁</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <button class="iconbtn" id="themebtn" type="button">
    <span class="theme-icon" aria-hidden="true"></span>
    <span class="sr-only" data-zh="切换主题" data-tw="切換主題" data-en="Switch theme"></span>
  </button>
</header>

<div class="actions commandbar">
  <button class="primary" id="startbtn" data-zh="启动" data-tw="啟動" data-en="Start"></button>
  <button id="stopbtn" data-zh="停止" data-tw="停止" data-en="Stop"></button>
  <button id="restartbtn" data-zh="重启" data-tw="重啟" data-en="Restart"></button>
  <span class="grow"></span>
  <p class="hint" id="detail"></p>
</div>

<div class="cards">

  <section class="card">
    <h2 data-zh="讲道语言" data-tw="講道語言" data-en="Sermon languages"></h2>
    <label>
      <span data-zh="讲员说的语言" data-tw="講員說的語言" data-en="The preacher speaks"></span>
      <select id="source">
        <option value="en" data-zh="英文" data-tw="英文" data-en="English"></option>
        <option value="zh" data-zh="中文" data-tw="中文" data-en="Chinese"></option>
        <option value="auto" data-zh="自动判断（讲员会换语言时用）"
                data-tw="自動判斷（講員會換語言時用）"
                data-en="Detect automatically — if they switch"></option>
      </select>
    </label>
    <label>
      <span data-zh="听众听到的语言" data-tw="聽眾聽到的語言" data-en="Listeners hear"></span>
      <select id="target">
        <option value="zh" data-zh="中文" data-tw="中文" data-en="Chinese"></option>
        <option value="en" data-zh="英文" data-tw="英文" data-en="English"></option>
      </select>
    </label>
    <p class="hint" id="langhint"></p>
  </section>

  <section class="card">
    <h2 data-zh="麦克风" data-tw="麥克風" data-en="Microphone"></h2>
    <label>
      <span data-zh="输入设备" data-tw="輸入裝置" data-en="Input device"></span>
      <select id="device"></select>
    </label>
    <div class="row actions-inline">
      <button id="rescan" data-zh="重新扫描设备" data-tw="重新掃描裝置"
              data-en="Look for new devices"></button>
    </div>
    <p class="hint"
       data-zh="蓝牙耳机是在这个页面打开之后才连上的，就点一下——设备列表只在页面加载时读一次。"
       data-tw="藍牙耳機是在這個頁面打開之後才連上的，就點一下——裝置清單只在頁面載入時讀一次。"
       data-en="Click this if you paired a headset after opening this page — the list is only read when the page loads."></p>
    <div class="meter"><i id="level"></i></div>
    <p class="hint" id="levelhint"></p>
  </section>

  <section class="card quality">
    <h2 data-zh="翻译质量" data-tw="翻譯品質" data-en="Translation quality"></h2>
    <label>
      <span data-zh="语言模型" data-tw="語言模型" data-en="Language model"></span>
      <select id="model">
        <option value="mlx-community/Qwen3-4B-Instruct-2507-4bit"
                data-zh="Qwen3 4B — 16 GB 的 Mac" data-tw="Qwen3 4B — 16 GB 的 Mac"
                data-en="Qwen3 4B — for 16 GB Macs"></option>
        <option value="mlx-community/Qwen3-8B-4bit"
                data-zh="Qwen3 8B — 更好，需要 24 GB" data-tw="Qwen3 8B — 更好，需要 24 GB"
                data-en="Qwen3 8B — better, needs 24 GB"></option>
        <option value="mlx-community/Qwen3.6-35B-A3B-8bit"
                data-zh="Qwen3.6 35B — 圣经书卷名可靠，需要 64 GB"
                data-tw="Qwen3.6 35B — 聖經書卷名可靠，需要 64 GB"
                data-en="Qwen3.6 35B — reliable book names, needs 64 GB"></option>
      </select>
    </label>
    <label>
      <span data-zh="引擎" data-tw="引擎" data-en="Engine"></span>
      <select id="engine">
        <option value="cascade" data-zh="识别 → 翻译 → 语音（稳定）"
                data-tw="辨識 → 翻譯 → 語音（穩定）"
                data-en="Recognise → translate → speak (steady)"></option>
        <option value="omni" data-zh="语音直入模型（实验，需 .venv-omni）"
                data-tw="語音直入模型（實驗，需 .venv-omni）"
                data-en="Audio straight into the model (experimental, needs .venv-omni)"></option>
      </select>
    </label>
    <label>
      <span data-zh="语音" data-tw="語音" data-en="Voice"></span>
      <select id="tts">
        <option value="qwen3" data-zh="Qwen3-TTS — 最好听" data-tw="Qwen3-TTS — 最好聽"
                data-en="Qwen3-TTS — best sounding"></option>
        <option value="kokoro" data-zh="Kokoro — 更快，跟不上时用"
                data-tw="Kokoro — 更快，跟不上時用"
                data-en="Kokoro — faster, use if it falls behind"></option>
      </select>
    </label>
    <div class="row">
      <label>
        <span data-zh="上下文（句）" data-tw="上下文（句）" data-en="Context (sentences)"></span>
        <input type="number" id="chat_size" min="0" max="8">
      </label>
      <label>
        <span data-zh="停顿多久算一句（毫秒）" data-tw="停頓多久算一句（毫秒）"
              data-en="Pause before translating (ms)"></span>
        <input type="number" id="min_silence_ms" min="32" max="1000" step="32">
      </label>
      <label>
        <span data-zh="语音缓冲（毫秒）" data-tw="語音緩衝（毫秒）"
              data-en="Voice buffer (ms)"></span>
        <input type="number" id="lead_ms" min="200" max="8000" step="100">
      </label>
    </div>
    <p class="hint"
       data-zh="语音断断续续就把缓冲调大，嫌慢就调小。立刻生效，不用重启。"
       data-tw="語音斷斷續續就把緩衝調大，嫌慢就調小。立刻生效，不用重啟。"
       data-en="Raise the voice buffer if the audio chops, lower it if the voice lags behind. Applies at once — no restart."></p>
    <p class="hint" id="restarthint"></p>
  </section>

  <section class="card listeners-card">
    <h2 data-zh="听众" data-tw="聽眾" data-en="Listeners"></h2>
    <div id="qr" role="img" aria-label="Listener QR code"></div>
    <a class="url" id="url" target="_blank" rel="noopener"></a>
    <div class="actions share-actions">
      <button class="compact" id="copyurl" type="button" data-zh="复制听众链接"
              data-tw="複製聽眾連結" data-en="Copy listener link"></button>
    </div>
    <div class="stat">
      <b data-zh="当前连接" data-tw="目前連線" data-en="Connected now"></b>
      <span id="listeners">0</span>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 data-zh="词表" data-tw="詞表" data-en="Glossary"></h2>
      <span class="count" id="glossarycount"></span>
    </div>
    <p class="hint"
       data-zh="告诉翻译该怎么处理你们的专有名词。每句话都会带上这份词表，所以越短越好。以 # 开头的行是给你自己看的注释，不会进模型。保存后下一句就生效，不用重启。"
       data-tw="告訴翻譯該怎麼處理你們的專有名詞。每句話都會帶上這份詞表，所以越短越好。以 # 開頭的行是給你自己看的註解，不會進模型。儲存後下一句就生效，不用重啟。"
       data-en="Tells the translator how to handle your proper nouns. It rides along with every sentence, so keep it short. Lines starting with # are notes to yourself and never reach the model. Saved changes apply to the next sentence — no restart."></p>
    <textarea id="glossary" spellcheck="false"></textarea>
    <div class="row actions-inline">
      <button id="savegloss" data-zh="保存词表" data-tw="儲存詞表" data-en="Save glossary"></button>
      <button id="loadexample" data-zh="插入示例" data-tw="插入範例"
              data-en="Insert an example"></button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 data-zh="实时字幕" data-tw="即時字幕" data-en="Live transcript"></h2>
      <button class="compact" id="clearlog" type="button" data-zh="清空" data-tw="清空"
              data-en="Clear"></button>
    </div>
    <ul id="log"><li class="empty" data-zh="还没有内容。" data-tw="還沒有內容。"
                     data-en="Nothing yet."></li></ul>
  </section>

</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const CFG = ["source", "target", "device", "model", "tts", "chat_size", "min_silence_ms",
             "lead_ms", "engine"];
const LANGS = ["zh", "tw", "en"];
const HTML_LANG = { zh: "zh-CN", tw: "zh-TW", en: "en" };

/* Strings the server or the meters produce at runtime, which no data- attribute can carry. */
const STR = {
  zh: { stopped:"已停止", starting:"启动中", running:"运行中", error:"出错", nolink:"控制台断开",
        sysdefault:"系统默认", rescanned:"设备已重新扫描", saved:"已保存", glossarysaved:"词表已保存", exampleadded:"示例已插入 — 改成你们自己的，再保存",
        copied:"听众链接已复制", copyfailed:"无法复制 — 请手动选择链接", cleared:"字幕已清空",
        requestfailed:"操作失败 — 请检查控制台连接", glossarycount:"{n} 个字符",
        restarting:"正在重启 — 模型加载要一分钟", restartneeded:"需要重启才能生效 — 新模型要重新加载。",
        micprompt:"对着麦克风说话，这条会动。", micgood:"声音正常。",
        micsilent:"没有声音进来 — 检查线和上面选的设备。", micclip:"爆音了 — 把音控台的输出调小。",
        direction:"{a} 讲道 → 听众听到 {b}。", samelang:"讲员说的和听众听到的是同一种语言，不会有翻译。",
        autolang:"讲员语言设为「自动」：凡是用{b}讲的都不会翻译，听众那边是静音。讲道用哪种语言就选哪种。",
        heard:"听到", translated:"翻译" },
  tw: { stopped:"已停止", starting:"啟動中", running:"執行中", error:"出錯", nolink:"控制台斷線",
        sysdefault:"系統預設", rescanned:"裝置已重新掃描", saved:"已儲存", glossarysaved:"詞表已儲存", exampleadded:"範例已插入 — 改成你們自己的，再儲存",
        copied:"聽眾連結已複製", copyfailed:"無法複製 — 請手動選取連結", cleared:"字幕已清空",
        requestfailed:"操作失敗 — 請檢查控制台連線", glossarycount:"{n} 個字元",
        restarting:"正在重啟 — 模型載入要一分鐘", restartneeded:"需要重啟才會生效 — 新模型要重新載入。",
        micprompt:"對著麥克風說話，這條會動。", micgood:"聲音正常。",
        micsilent:"沒有聲音進來 — 檢查線和上面選的裝置。", micclip:"爆音了 — 把音控台的輸出調小。",
        direction:"{a} 講道 → 聽眾聽到 {b}。", samelang:"講員說的和聽眾聽到的是同一種語言，不會有翻譯。",
        autolang:"講員語言設為「自動」：凡是用{b}講的都不會翻譯，聽眾那邊是靜音。講道用哪種語言就選哪種。",
        heard:"聽到", translated:"翻譯" },
  en: { stopped:"stopped", starting:"starting", running:"running", error:"error",
        nolink:"no console link", sysdefault:"System default", rescanned:"Device list refreshed", saved:"Saved",
        glossarysaved:"Glossary saved", exampleadded:"Example added — edit it for your church, then save", restarting:"Restarting — models take a minute",
        copied:"Listener link copied", copyfailed:"Could not copy — select the link manually", cleared:"Transcript cleared",
        requestfailed:"Action failed — check the console connection", glossarycount:"{n} characters",
        restartneeded:"Restart to apply — the new model has to load.",
        micprompt:"Speak into the mic — the bar should move.", micgood:"Audio looks good.",
        micsilent:"No audio reaching the Mac — check the cable and the device above.",
        micclip:"Clipping — turn the send down at the desk.",
        direction:"Preached in {a}, heard as {b}.", samelang:"Source and target are the same language — nothing will be translated.",
        autolang:"Source is Auto, so anything preached in {b} is passed over and the listeners hear silence. Pick the language the sermon is in.",
        heard:"HEARD", translated:"TRANSLATED" },
};

/* Same storage contract as slashai.app, so the choice matches the rest of the site. */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem("slashai." + key); return v === null ? fallback : JSON.parse(v); }
    catch (_) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("slashai." + key, JSON.stringify(value)); } catch (_) {}
  },
};

let lang = (() => {
  const saved = store.get("lang", null);
  if (LANGS.includes(saved)) return saved;
  const nav = (navigator.language || "en").toLowerCase();
  if (nav.startsWith("zh")) return /hant|tw|hk|mo/.test(nav) ? "tw" : "zh";
  return "en";
})();
let theme = store.get("theme", "auto");
let current = null;          // last status from the server
let deviceList = null;       // filled once by /api/devices
let restartPending = false;
let linkLost = false;
let busyAction = null;
let qrUrl = null;            // the URL the QR on screen actually encodes
const t = (key) => STR[lang][key];

/* Spoken/heard language names, per console language. */
const PLACEHOLDER = {
  zh: "# 注释写在 # 后面，不会进模型\n\n翻译以下词汇时请统一用法：\n  fellowship -> 团契\n  Pastor John Smith -> 史约翰牧师\n\n# 圣经书卷名已内置（和合本），无需在此重复。",
  tw: "# 註解寫在 # 後面，不會進模型\n\n翻譯以下詞彙時請統一用法：\n  fellowship -> 團契\n  Pastor John Smith -> 史約翰牧師\n\n# 聖經書卷名已內建（和合本），無須在此重複。",
  en: "# notes after a # are never sent to the model\n\nRender these terms consistently:\n  fellowship -> 团契\n  Pastor John Smith -> 史约翰牧师\n\n# the 66 Chinese book names are built in; no need to repeat them here",
};

const LANGNAME = {
  zh: { en:"英文", zh:"中文", auto:"自动判断" },
  tw: { en:"英文", zh:"中文", auto:"自動判斷" },
  en: { en:"English", zh:"Chinese", auto:"auto-detect" },
};

/* "auto" is what the rest of slashai.app stores, but this page has no light default to
   fall back on, so resolve it against the OS and always render an explicit theme.
   Otherwise auto and dark look identical and every other click appears to do nothing. */
function shown() {
  if (theme !== "auto") return theme;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
    ? "light" : "dark";
}

function applyTheme() {
  document.documentElement.dataset.theme = shown();
  $("themebtn").dataset.mode = shown();
}

/* Language-driven. Only ever called when the console language changes, because rewriting
   <option> text under an open dropdown closes it, and the heartbeat paints twice a second. */
function labels() {
  document.documentElement.lang = HTML_LANG[lang];
  document.querySelectorAll("[data-en]").forEach((el) => {
    el.textContent = el.dataset[lang] || el.dataset.en;
  });
  $("glossary").placeholder = PLACEHOLDER[lang];
  updateGlossaryCount();
  document.querySelectorAll("#langseg button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
  if (deviceList) {
    const keep = $("device").value;
    // new Option() escapes; device names are whatever the vendor felt like putting in them
    $("device").replaceChildren(new Option(t("sysdefault"), ""),
      ...deviceList.map((d) => new Option(`${d.name} (${d.channels} ch)`, d.name)));
    $("device").value = keep;
  }
}

/* Status-driven, runs on every heartbeat. Touches text and values, never option lists. */
function paint() {
  $("restarthint").textContent = restartPending ? t("restartneeded") : "";
  $("restarthint").className = "hint" + (restartPending ? " warn" : "");
  $("restartbtn").className = restartPending ? "attention" : "";

  const s = current;
  if (linkLost) { $("state").dataset.s = "error"; $("statetext").textContent = t("nolink"); }
  else if (s) { $("state").dataset.s = s.state; $("statetext").textContent = t(s.state); }
  if (!s) return;

  const from = LANGNAME[lang][s.config.source], into = LANGNAME[lang][s.config.target];
  const same = s.config.source === s.config.target;
  // "auto" is not equal to the target but can turn out to be it, and the translator is told
  // to stay silent on anything already in the target language. That reads as a dead system.
  const maybeSame = !same && s.config.source === "auto";
  $("langhint").textContent = same ? t("samelang")
    : maybeSame ? t("autolang").replace("{b}", into)
    : t("direction").replace("{a}", from).replace("{b}", into);
  $("langhint").className = "hint" + (same || maybeSame ? " warn" : "");

  $("detail").textContent = s.detail || "";
  $("listeners").textContent = s.listeners;
  $("url").textContent = s.url;
  $("url").href = s.url || "";
  if (s.url && s.url !== qrUrl) {
    qrUrl = s.url;
    fetch("/qr.svg").then((r) => (r.ok ? r.text() : "")).then((svg) => {
      $("qr").innerHTML = svg;                   // empty => segno isn't installed
      $("qr").style.display = svg ? "grid" : "none";
    });
  }

  $("level").style.width = Math.min(100, s.level * 140) + "%";
  $("level").className = s.level > .92 ? "hot" : s.level < .02 ? "quiet" : "";
  $("levelhint").textContent = s.state !== "running" ? t("micprompt")
    : s.level < .02 ? t("micsilent") : s.level > .92 ? t("micclip") : t("micgood");

  $("startbtn").disabled = linkLost || busyAction !== null || s.state === "running" || s.state === "starting";
  $("stopbtn").disabled = linkLost || busyAction !== null || s.state === "stopped";
  $("restartbtn").disabled = linkLost || busyAction !== null || s.state === "starting";
  ["startbtn", "stopbtn", "restartbtn"].forEach((id) =>
    $(id).setAttribute("aria-busy", String(busyAction === id)));

  // Don't fight the operator's cursor: only fill fields they aren't editing.
  CFG.forEach((key) => {
    if (document.activeElement === $(key)) return;
    $(key).value = key === "device" ? (s.config.device ?? "") : s.config[key];
  });
}

const render = () => { labels(); paint(); };

const toast = (key) => {
  $("toast").textContent = t(key);
  $("toast").classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => $("toast").classList.remove("show"), 2200);
};

const post = (path, body) =>
  fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}) }).then((r) => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    });

const act = async (id, path, done) => {
  busyAction = id;
  paint();
  try {
    const result = await post(path);
    if (done) done(result);
    return result;
  } catch (error) {
    console.error(error);
    toast("requestfailed");
    return null;
  } finally {
    busyAction = null;
    paint();
  }
};

$("startbtn").onclick = () => act("startbtn", "/api/start");
$("stopbtn").onclick = () => act("stopbtn", "/api/stop");
$("restartbtn").onclick = () => act("restartbtn", "/api/restart", () => {
  restartPending = false;
  toast("restarting");
});
$("loadexample").onclick = () => fetch("/api/glossary/example")
  .then((r) => (r.ok ? r.text() : "")).then((text) => {
    if (!text) return;
    const box = $("glossary");
    box.value = box.value.trim() ? box.value.replace(/\s*$/, "\n\n") + text : text;
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
    toast("exampleadded");
  });

function updateGlossaryCount() {
  const n = $("glossary").value.length;
  $("glossarycount").textContent = t("glossarycount").replace("{n}", n.toLocaleString());
  $("glossarycount").className = "count" + (n > 1200 ? " warn" : "");
}

$("glossary").addEventListener("input", updateGlossaryCount);
$("savegloss").onclick = async () => {
  try {
    await post("/api/glossary", { text: $("glossary").value });
    toast("glossarysaved");
  } catch (error) {
    console.error(error);
    toast("requestfailed");
  }
};

$("copyurl").onclick = async () => {
  if (!current?.url) return;
  try {
    await navigator.clipboard.writeText(current.url);
    toast("copied");
  } catch (_) {
    toast("copyfailed");
    $("url").focus();
  }
};

$("langseg").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  lang = b.dataset.lang;
  store.set("lang", lang);
  render();
};
$("themebtn").onclick = () => {
  theme = shown() === "light" ? "dark" : "light";   // flip what is on screen, every time
  store.set("theme", theme);
  applyTheme();
};

CFG.forEach((key) => $(key).addEventListener("change", () => {
  const el = $(key);
  let value = el.type === "number" ? Number(el.value) : el.value;
  if (key === "device") value = el.value === "" ? null : el.value;
  post("/api/config", { [key]: value }).then((r) => {
    // A live setting can save after a model setting. Never let its `false` response erase
    // the restart the earlier change still needs.
    restartPending = restartPending || r.restart_required;
    paint();
    toast("saved");
  }).catch((error) => {
    console.error(error);
    toast("requestfailed");
  });
}));

fetch("/api/glossary").then((r) => r.json()).then(({ text }) => {
  $("glossary").value = text;
  updateGlossaryCount();
}).catch((error) => console.error(error));

const loadDevices = () =>
  fetch("/api/devices").then((r) => r.json()).then(({ devices, error }) => {
    deviceList = devices;
    render();
    // render() restores whatever was selected; the saved mic wins on the first load
    if (current) $("device").value = current.config.device ?? "";
    if (error) { $("levelhint").textContent = error; $("levelhint").className = "hint warn"; }
  });

loadDevices();
// PortAudio only notices a headset that was paired later when it is torn down and brought
// back up, which is what /api/devices does. Nothing else on this page may trigger that: it
// closes and reopens the mic, so it stays on a button the operator presses.
$("rescan").addEventListener("click", () => loadDevices().then(() => toast("rescanned")));

$("clearlog").onclick = () => {
  const empty = document.createElement("li");
  empty.className = "empty";
  empty.dataset.zh = "还没有内容。";
  empty.dataset.tw = "還沒有內容。";
  empty.dataset.en = "Nothing yet.";
  empty.textContent = empty.dataset[lang];
  $("log").replaceChildren(empty);
  toast("cleared");
};

document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s" &&
      document.activeElement === $("glossary")) {
    event.preventDefault();
    $("savegloss").click();
  }
});

function addLine(line) {
  const log = $("log");
  log.querySelector(".empty")?.remove();
  const li = document.createElement("li");
  const tag = document.createElement("div");
  tag.className = "t";
  // data- attributes, so switching language relabels lines already on screen
  LANGS.forEach((l) => {
    tag.dataset[l] = `${line.at} · ${STR[l][line.kind === "src" ? "heard" : "translated"]}`;
  });
  tag.textContent = tag.dataset[lang];
  const body = document.createElement("div");
  body.className = line.kind;
  body.textContent = line.text;
  // stay pinned to the newest line, unless the operator has scrolled up to read something
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  li.append(tag, body);
  log.appendChild(li);
  while (log.children.length > 30) log.firstChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

const es = new EventSource("/api/events");
es.addEventListener("status", (e) => { linkLost = false; current = JSON.parse(e.data); paint(); });
es.addEventListener("line", (e) => addLine(JSON.parse(e.data)));
es.onopen = () => { linkLost = false; paint(); };
es.onerror = () => { linkLost = true; paint(); };

applyTheme();
render();
</script>
</body>
</html>
