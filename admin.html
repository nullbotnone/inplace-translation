<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sermon Translation · Console</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#071013;--surface:#0b181b;--surface-2:#112121;--ink:#f1eadb;--dim:#a9a899;
    --line:#dccca429;--line-strong:#d2bb8454;--accent:#8fa7c2;--on-accent:#08151c;
    --ok:#91a89f;--warn:#e2c57b;--bad:#c98f7b;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f1eadb;--surface:#faf5e9;--surface-2:#e8dfcc;--ink:#102022;--dim:#5f6964;
    --line:#8b754936;--line-strong:#9b7d3f80;--accent:#3f5d7d;--on-accent:#f6f1e6;
    --ok:#4a6b5d;--warn:#8a6a1f;--bad:#a05a42;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 system-ui,"PingFang SC","Noto Sans SC",sans-serif}
  .wrap{max-width:60rem;margin:0 auto;padding:1.5rem}
  h1{margin:0;font-size:1.1rem;font-weight:650;letter-spacing:-.01em}
  h2{margin:0 0 1rem;font:750 .72rem/1.4 var(--mono);letter-spacing:.12em;
     text-transform:uppercase;color:var(--dim)}
  header{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
         padding-bottom:1.2rem;border-bottom:1px solid var(--line)}
  .grow{flex:1}

  .state{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .8rem;border-radius:999px;
         border:1px solid var(--line);font:750 .72rem/1.4 var(--mono);letter-spacing:.1em;
         text-transform:uppercase}
  .state i{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;
           box-shadow:0 0 10px currentColor}
  .state[data-s=running]{color:var(--ok)} .state[data-s=running] i{animation:pulse 2s infinite}
  .state[data-s=starting]{color:var(--warn)} .state[data-s=starting] i{animation:pulse .8s infinite}
  .state[data-s=stopped]{color:var(--dim)}
  .state[data-s=error]{color:var(--bad)}
  @keyframes pulse{50%{opacity:.3}}

  button{font:inherit;font-size:.88rem;font-weight:650;padding:.55rem 1.1rem;border-radius:8px;
         border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button.primary:hover:not(:disabled){filter:brightness(1.1);color:var(--on-accent)}

  /* Language and theme controls, same shape as the rest of slashai.app. */
  .seg{display:inline-flex;padding:.2rem;border:1px solid var(--line);border-radius:999px;
       background:var(--surface)}
  .seg button{min-width:2.2rem;border:0;border-radius:999px;background:transparent;
              color:var(--dim);padding:.27rem .52rem;font-size:.8125rem}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
  .iconbtn{width:2.3rem;height:2.3rem;padding:0;display:grid;place-items:center;border-radius:50%;
           border:1px solid var(--line);background:var(--surface)}
  .theme-icon{width:.95rem;height:.95rem;border:1.5px solid currentColor;border-radius:50%;
              box-shadow:inset -.3rem -.3rem 0 currentColor;transform:rotate(-25deg);
              transition:transform .25s ease}
  .iconbtn:hover .theme-icon{transform:rotate(20deg)}
  .iconbtn[data-mode=light] .theme-icon{background:currentColor;box-shadow:none}
  .iconbtn[data-mode=dark] .theme-icon{background:transparent;
                                       box-shadow:inset -.32rem -.2rem 0 currentColor}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

  .cards{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));margin-top:1.5rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem}
  .card.wide{grid-column:1/-1}
  label{display:block;margin-bottom:1rem}
  label span{display:block;margin-bottom:.3rem;font-size:.82rem;color:var(--dim)}
  select,input[type=number],textarea{width:100%;font:inherit;font-size:.88rem;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
  textarea{min-height:11rem;font:.82rem/1.7 var(--mono);resize:vertical}
  .row{display:flex;gap:.8rem;align-items:flex-end}
  .row label{flex:1}
  .hint{margin:0;font-size:.8rem;color:var(--dim)}
  .hint.warn{color:var(--warn)}

  .meter{height:.5rem;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:.5rem 0 .4rem}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s linear}
  .meter i.hot{background:var(--bad)}
  .meter i.quiet{background:var(--dim)}

  .stat{display:flex;justify-content:space-between;padding:.45rem 0;font-size:.88rem}
  .stat span{color:var(--dim);font-family:var(--mono);font-size:.82rem}

  #qr{display:grid;place-items:center;padding:.8rem;background:#fff;border-radius:10px}
  #qr svg{display:block;width:100%;height:auto;max-width:13rem}
  .url{margin:.7rem 0 0;text-align:center;font:.85rem/1.5 var(--mono);word-break:break-all;
       color:var(--accent)}

  #log{margin:0;padding:0;list-style:none;max-height:22rem;overflow-y:auto}
  #log li{padding:.5rem 0;border-bottom:1px solid var(--line)}
  #log li:last-child{border-bottom:0}
  #log .t{color:var(--dim);font:.7rem/1 var(--mono);letter-spacing:.08em}
  #log .src{color:var(--dim);font-size:.85rem}
  #log .out{font-size:1rem}
  .empty{color:var(--dim);font-size:.85rem}

  .toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,2rem);opacity:0;
         background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;
         padding:.6rem 1.1rem;font-size:.82rem;font-weight:650;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1 data-zh="讲道翻译控制台" data-tw="講道翻譯控制台" data-en="Sermon Translation"></h1>
  <span class="state" id="state" data-s="stopped"><i></i><span id="statetext"></span></span>
  <span class="grow"></span>
  <div class="seg" role="group" id="langseg"
       data-zh="控制台语言" data-tw="控制台語言" data-en="Console language">
    <button type="button" data-lang="zh">简</button>
    <button type="button" data-lang="tw">繁</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <button class="iconbtn" id="themebtn" type="button">
    <span class="theme-icon" aria-hidden="true"></span>
    <span class="sr-only" data-zh="切换主题" data-tw="切換主題" data-en="Switch theme"></span>
  </button>
</header>

<header style="border:0;padding-top:1rem">
  <button class="primary" id="startbtn" data-zh="启动" data-tw="啟動" data-en="Start"></button>
  <button id="stopbtn" data-zh="停止" data-tw="停止" data-en="Stop"></button>
  <button id="restartbtn" data-zh="重启" data-tw="重啟" data-en="Restart"></button>
  <span class="grow"></span>
  <p class="hint" id="detail"></p>
</header>

<div class="cards">

  <div class="card">
    <h2 data-zh="讲道语言" data-tw="講道語言" data-en="Sermon languages"></h2>
    <label>
      <span data-zh="讲员说的语言" data-tw="講員說的語言" data-en="The preacher speaks"></span>
      <select id="source">
        <option value="en" data-zh="英文" data-tw="英文" data-en="English"></option>
        <option value="zh" data-zh="中文" data-tw="中文" data-en="Chinese"></option>
        <option value="auto" data-zh="自动判断（讲员会换语言时用）"
                data-tw="自動判斷（講員會換語言時用）"
                data-en="Detect automatically — if they switch"></option>
      </select>
    </label>
    <label>
      <span data-zh="听众听到的语言" data-tw="聽眾聽到的語言" data-en="Listeners hear"></span>
      <select id="target">
        <option value="zh-Hans" data-zh="简体中文" data-tw="簡體中文"
                data-en="Chinese — Simplified 简体"></option>
        <option value="zh-Hant" data-zh="繁体中文" data-tw="繁體中文"
                data-en="Chinese — Traditional 繁體"></option>
        <option value="en" data-zh="英文" data-tw="英文" data-en="English"></option>
      </select>
    </label>
    <p class="hint" id="langhint"></p>
  </div>

  <div class="card">
    <h2 data-zh="麦克风" data-tw="麥克風" data-en="Microphone"></h2>
    <label>
      <span data-zh="输入设备" data-tw="輸入裝置" data-en="Input device"></span>
      <select id="device"></select>
    </label>
    <div class="meter"><i id="level"></i></div>
    <p class="hint" id="levelhint"></p>
  </div>

  <div class="card">
    <h2 data-zh="听众" data-tw="聽眾" data-en="Listeners"></h2>
    <div id="qr"></div>
    <p class="url" id="url"></p>
    <div class="stat">
      <b data-zh="当前连接" data-tw="目前連線" data-en="Connected now"></b>
      <span id="listeners">0</span>
    </div>
  </div>

  <div class="card">
    <h2 data-zh="翻译质量" data-tw="翻譯品質" data-en="Translation quality"></h2>
    <label>
      <span data-zh="语言模型" data-tw="語言模型" data-en="Language model"></span>
      <select id="model">
        <option value="mlx-community/Qwen3-4B-Instruct-2507-4bit"
                data-zh="Qwen3 4B — 16 GB 的 Mac" data-tw="Qwen3 4B — 16 GB 的 Mac"
                data-en="Qwen3 4B — for 16 GB Macs"></option>
        <option value="mlx-community/Qwen3-8B-Instruct-4bit"
                data-zh="Qwen3 8B — 更好，需要 24 GB" data-tw="Qwen3 8B — 更好，需要 24 GB"
                data-en="Qwen3 8B — better, needs 24 GB"></option>
      </select>
    </label>
    <label>
      <span data-zh="语音" data-tw="語音" data-en="Voice"></span>
      <select id="tts">
        <option value="qwen3" data-zh="Qwen3-TTS — 最好听" data-tw="Qwen3-TTS — 最好聽"
                data-en="Qwen3-TTS — best sounding"></option>
        <option value="kokoro" data-zh="Kokoro — 更快，跟不上时用"
                data-tw="Kokoro — 更快，跟不上時用"
                data-en="Kokoro — faster, use if it falls behind"></option>
      </select>
    </label>
    <div class="row">
      <label>
        <span data-zh="上下文（句）" data-tw="上下文（句）" data-en="Context (sentences)"></span>
        <input type="number" id="chat_size" min="0" max="8">
      </label>
      <label>
        <span data-zh="停顿多久算一句（毫秒）" data-tw="停頓多久算一句（毫秒）"
              data-en="Pause before translating (ms)"></span>
        <input type="number" id="min_silence_ms" min="32" max="1000" step="32">
      </label>
    </div>
    <p class="hint" id="restarthint"></p>
  </div>

  <div class="card">
    <h2 data-zh="词表" data-tw="詞表" data-en="Glossary"></h2>
    <p class="hint"
       data-zh="你们的事工名称、长老的名字、你们引用的圣经译本。保存后下一句就生效，不用重启。"
       data-tw="你們的事工名稱、長老的名字、你們引用的聖經譯本。儲存後下一句就生效，不用重啟。"
       data-en="Your ministry names, your elders' names, the Bible version you quote. Saved changes apply to the next sentence — no restart."></p>
    <textarea id="glossary" spellcheck="false"></textarea>
    <button id="savegloss" style="margin-top:.7rem"
            data-zh="保存词表" data-tw="儲存詞表" data-en="Save glossary"></button>
  </div>

  <div class="card wide">
    <h2 data-zh="实时字幕" data-tw="即時字幕" data-en="Live transcript"></h2>
    <ul id="log"><li class="empty" data-zh="还没有内容。" data-tw="還沒有內容。"
                     data-en="Nothing yet."></li></ul>
  </div>

</div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const CFG = ["source", "target", "device", "model", "tts", "chat_size", "min_silence_ms"];
const LANGS = ["zh", "tw", "en"];
const HTML_LANG = { zh: "zh-CN", tw: "zh-TW", en: "en" };

/* Strings the server or the meters produce at runtime, which no data- attribute can carry. */
const STR = {
  zh: { stopped:"已停止", starting:"启动中", running:"运行中", error:"出错", nolink:"控制台断开",
        sysdefault:"系统默认", saved:"已保存", glossarysaved:"词表已保存",
        restarting:"正在重启 — 模型加载要一分钟", restartneeded:"需要重启才能生效 — 新模型要重新加载。",
        micprompt:"对着麦克风说话，这条会动。", micgood:"声音正常。",
        micsilent:"没有声音进来 — 检查线和上面选的设备。", micclip:"爆音了 — 把音控台的输出调小。",
        direction:"{a} 讲道 → 听众听到 {b}。", samelang:"讲员说的和听众听到的是同一种语言，不会有翻译。",
        heard:"听到", translated:"翻译" },
  tw: { stopped:"已停止", starting:"啟動中", running:"執行中", error:"出錯", nolink:"控制台斷線",
        sysdefault:"系統預設", saved:"已儲存", glossarysaved:"詞表已儲存",
        restarting:"正在重啟 — 模型載入要一分鐘", restartneeded:"需要重啟才會生效 — 新模型要重新載入。",
        micprompt:"對著麥克風說話，這條會動。", micgood:"聲音正常。",
        micsilent:"沒有聲音進來 — 檢查線和上面選的裝置。", micclip:"爆音了 — 把音控台的輸出調小。",
        direction:"{a} 講道 → 聽眾聽到 {b}。", samelang:"講員說的和聽眾聽到的是同一種語言，不會有翻譯。",
        heard:"聽到", translated:"翻譯" },
  en: { stopped:"stopped", starting:"starting", running:"running", error:"error",
        nolink:"no console link", sysdefault:"System default", saved:"Saved",
        glossarysaved:"Glossary saved", restarting:"Restarting — models take a minute",
        restartneeded:"Restart to apply — the new model has to load.",
        micprompt:"Speak into the mic — the bar should move.", micgood:"Audio looks good.",
        micsilent:"No audio reaching the Mac — check the cable and the device above.",
        micclip:"Clipping — turn the send down at the desk.",
        direction:"Preached in {a}, heard as {b}.", samelang:"Source and target are the same language — nothing will be translated.",
        heard:"HEARD", translated:"TRANSLATED" },
};

/* Same storage contract as slashai.app, so the choice matches the rest of the site. */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem("slashai." + key); return v === null ? fallback : JSON.parse(v); }
    catch (_) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("slashai." + key, JSON.stringify(value)); } catch (_) {}
  },
};

let lang = (() => {
  const saved = store.get("lang", null);
  if (LANGS.includes(saved)) return saved;
  const nav = (navigator.language || "en").toLowerCase();
  if (nav.startsWith("zh")) return /hant|tw|hk|mo/.test(nav) ? "tw" : "zh";
  return "en";
})();
let theme = store.get("theme", "auto");
let current = null;          // last status from the server
let deviceList = null;       // filled once by /api/devices
let restartPending = false;
let linkLost = false;
let qrUrl = null;            // the URL the QR on screen actually encodes
const t = (key) => STR[lang][key];

/* Spoken/heard language names, per console language. */
const LANGNAME = {
  zh: { en:"英文", zh:"中文", auto:"自动判断", "zh-Hans":"简体中文", "zh-Hant":"繁体中文" },
  tw: { en:"英文", zh:"中文", auto:"自動判斷", "zh-Hans":"簡體中文", "zh-Hant":"繁體中文" },
  en: { en:"English", zh:"Chinese", auto:"auto-detect", "zh-Hans":"Simplified Chinese",
        "zh-Hant":"Traditional Chinese" },
};

function applyTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  $("themebtn").dataset.mode = theme;
}

/* One render path: static labels from data- attributes, everything else from STR. */
function render() {
  document.documentElement.lang = HTML_LANG[lang];
  document.querySelectorAll("[data-en]").forEach((el) => {
    el.textContent = el.dataset[lang] || el.dataset.en;
  });
  document.querySelectorAll("#langseg button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });

  if (deviceList) {
    const keep = $("device").value;
    $("device").innerHTML = `<option value="">${t("sysdefault")}</option>` +
      deviceList.map((d) => `<option value="${d.index}">${d.name} (${d.channels} ch)</option>`).join("");
    $("device").value = keep;
  }
  if (s) {
    const from = LANGNAME[lang][s.config.source], into = LANGNAME[lang][s.config.target];
    const same = s.config.source === "en" ? s.config.target === "en"
               : s.config.source === "zh" ? s.config.target.startsWith("zh") : false;
    $("langhint").textContent = same ? t("samelang")
      : t("direction").replace("{a}", from).replace("{b}", into);
    $("langhint").className = "hint" + (same ? " warn" : "");
  }
  $("restarthint").textContent = restartPending ? t("restartneeded") : "";
  $("restarthint").className = "hint" + (restartPending ? " warn" : "");

  const s = current;
  if (linkLost) { $("state").dataset.s = "error"; $("statetext").textContent = t("nolink"); }
  else if (s) { $("state").dataset.s = s.state; $("statetext").textContent = t(s.state); }
  if (!s) return;

  $("detail").textContent = s.detail || "";
  $("listeners").textContent = s.listeners;
  $("url").textContent = s.url;
  if (s.url && s.url !== qrUrl) {
    qrUrl = s.url;
    fetch("/qr.svg").then((r) => (r.ok ? r.text() : "")).then((svg) => {
      $("qr").innerHTML = svg;                   // empty => segno isn't installed
      $("qr").style.display = svg ? "grid" : "none";
    });
  }

  $("level").style.width = Math.min(100, s.level * 140) + "%";
  $("level").className = s.level > .92 ? "hot" : s.level < .02 ? "quiet" : "";
  $("levelhint").textContent = s.state !== "running" ? t("micprompt")
    : s.level < .02 ? t("micsilent") : s.level > .92 ? t("micclip") : t("micgood");

  $("startbtn").disabled = s.state === "running" || s.state === "starting";
  $("stopbtn").disabled = s.state === "stopped";

  // Don't fight the operator's cursor: only fill fields they aren't editing.
  CFG.forEach((key) => {
    if (document.activeElement === $(key)) return;
    $(key).value = key === "device" ? (s.config.device ?? "") : s.config[key];
  });
  if (document.activeElement !== $("glossary")) $("glossary").value = s.glossary;
}

const toast = (key) => {
  $("toast").textContent = t(key);
  $("toast").classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => $("toast").classList.remove("show"), 2200);
};

const post = (path, body) =>
  fetch(path, { method: "POST", body: JSON.stringify(body || {}) }).then((r) => r.json());

$("startbtn").onclick = () => post("/api/start");
$("stopbtn").onclick = () => post("/api/stop");
$("restartbtn").onclick = () => { post("/api/restart"); restartPending = false; toast("restarting"); };
$("savegloss").onclick = () =>
  post("/api/glossary", { text: $("glossary").value }).then(() => toast("glossarysaved"));

$("langseg").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  lang = b.dataset.lang;
  store.set("lang", lang);
  render();
};
$("themebtn").onclick = () => {
  theme = theme === "auto" ? "light" : theme === "light" ? "dark" : "auto";
  store.set("theme", theme);
  applyTheme();
};

CFG.forEach((key) => $(key).addEventListener("change", () => {
  const el = $(key);
  let value = el.type === "number" ? Number(el.value) : el.value;
  if (key === "device") value = el.value === "" ? null : Number(el.value);
  post("/api/config", { [key]: value }).then((r) => {
    restartPending = r.restart_required;
    render();
    toast("saved");
  });
}));

fetch("/api/devices").then((r) => r.json()).then(({ devices, error }) => {
  deviceList = devices;
  render();
  if (current) $("device").value = current.config.device ?? "";
  if (error) { $("levelhint").textContent = error; $("levelhint").className = "hint warn"; }
});

function addLine(line) {
  const log = $("log");
  log.querySelector(".empty")?.remove();
  const li = document.createElement("li");
  const tag = document.createElement("div");
  tag.className = "t";
  // data- attributes, so switching language relabels lines already on screen
  LANGS.forEach((l) => {
    tag.dataset[l] = `${line.at} · ${STR[l][line.kind === "src" ? "heard" : "translated"]}`;
  });
  tag.textContent = tag.dataset[lang];
  const body = document.createElement("div");
  body.className = line.kind;
  body.textContent = line.text;
  li.append(tag, body);
  log.appendChild(li);
  while (log.children.length > 60) log.firstChild.remove();
  log.scrollTop = log.scrollHeight;
}

const es = new EventSource("/api/events");
es.addEventListener("status", (e) => { linkLost = false; current = JSON.parse(e.data); render(); });
es.addEventListener("line", (e) => addLine(JSON.parse(e.data)));
es.onopen = () => { linkLost = false; render(); };
es.onerror = () => { linkLost = true; render(); };

applyTheme();
render();
</script>
</body>
</html>
